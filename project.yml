name: Viewportix
options:
  bundleIdPrefix: com.viewportix
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  ViewportixKit:
    path: Packages/ViewportixKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Viewportix:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    sources:
      - Viewportix
    dependencies:
      - package: ViewportixKit
        product: EngineCore
      - package: ViewportixKit
        product: DeviceCatalog
      - package: ViewportixKit
        product: ProjectModel
      - package: ViewportixKit
        product: SyncCore
      - package: ViewportixKit
        product: WebKitEngine
      - package: ViewportixKit
        product: Capture
      - package: ViewportixKit
        product: DesignSystem
    info:
      path: Viewportix/Info.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Viewportix Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [com.viewportix.project]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.viewportix.project
            UTTypeDescription: Viewportix Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [viewportix]
        # Web pages may be plain http (local dev servers, staging); the app itself makes no other requests.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.viewportix.Viewportix
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Viewportix
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Sandbox stays off so later engines can launch Chrome/Firefox; hardened runtime for notarization.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: media</title>
<!-- Media-suspension fixture: a muted, looping silent WAV built in script, so no binary asset is needed. -->
</head>
<body>
<audio id="audio" autoplay loop muted></audio>
<script>
  const rate = 8000;
  const samples = rate;  // one second of silence
  const buffer = new ArrayBuffer(44 + samples * 2);
  const view = new DataView(buffer);
  const text = (offset, value) => [...value].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
  text(0, 'RIFF'); view.setUint32(4, 36 + samples * 2, true); text(8, 'WAVE');
  text(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  text(36, 'data'); view.setUint32(40, samples * 2, true);
  const audio = document.getElementById('audio');
  audio.src = URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
  audio.play().catch(() => {});
</script>
</body>
</html>
